<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2a134a">
    <title>Checklist App</title>
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        /* Custom Fonts Inclusion */
        @font-face {
            font-family: 'Bookman';
            src: url('bookman.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Lipishree';
            src: url('lipishree.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --app-height: 100dvh;
        }
        
        /* Essential Mobile Fixes & Custom Font Application */
        html, body {
            height: var(--app-height);
            width: 100%;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            touch-action: pan-x pan-y;
            font-family: 'Bookman', 'Lipishree', sans-serif; 
        }
        ::-webkit-scrollbar { display: none; }
        
        /* Animations */
        .fade-down { animation: fadeDown 0.5s forwards ease-in-out; }
        .slide-up { animation: slideUp 0.2s forwards ease-out; }
        
        @keyframes fadeDown {
            0% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }

        .drag-handle { touch-action: none; cursor: grab; }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-[#2a134a] via-[#0d122b] to-[#040613] text-white flex justify-center">

    <div id="app-container" class="w-full sm:max-w-md bg-transparent relative flex flex-col shadow-2xl overflow-hidden" style="height: var(--app-height);">
        
        <header class="bg-[#0d122b]/60 backdrop-blur-md border-b border-indigo-500/30 shadow-[0_0_20px_rgba(99,102,241,0.15)] px-4 py-3 flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center w-1/4">
                <button id="back-btn" class="hidden text-xl text-white p-2 hover:text-indigo-300 transition-colors"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            
            <div class="flex-grow flex justify-center w-2/4">
                <div class="relative w-full max-w-[200px]">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-indigo-300/60 text-sm"></i>
                    <input type="text" placeholder="Search..." class="w-full bg-black/20 text-white placeholder-indigo-200/50 border border-indigo-500/30 shadow-[inset_0_0_10px_rgba(99,102,241,0.1)] rounded-full py-1.5 pl-9 pr-3 text-sm focus:outline-none focus:border-indigo-400 focus:shadow-[0_0_15px_rgba(99,102,241,0.3)] transition-all">
                </div>
            </div>

            <div class="flex justify-end w-1/4">
                <button id="auth-btn" onclick="toggleGoogleAuth()" class="text-xs font-bold text-white flex items-center space-x-1 border border-indigo-500/40 bg-indigo-900/30 shadow-[0_0_10px_rgba(99,102,241,0.2)] px-2 py-1 rounded-md hover:bg-indigo-800/50 transition-all">
                    <i class="fa-brands fa-google text-white"></i>
                    <span id="auth-text">Login</span>
                </button>
            </div>
        </header>

        <main id="main-content" class="flex-grow overflow-y-auto p-4 pb-28 relative"></main>

        <div id="outer-fab-container" class="absolute bottom-6 w-full px-6 flex justify-between pointer-events-none z-10">
            <button id="btn-new-group" onclick="openModal('group')" class="pointer-events-auto bg-indigo-900/40 backdrop-blur-lg border border-purple-400/40 text-white w-14 h-14 rounded-2xl shadow-[0_0_20px_rgba(168,85,247,0.3)] flex items-center justify-center text-xl transition transform active:scale-95 hover:shadow-[0_0_30px_rgba(168,85,247,0.6)]">
                <i class="fa-solid fa-layer-group"></i>
            </button>
            <button id="btn-new-list" onclick="openModal('list')" class="pointer-events-auto bg-purple-900/40 backdrop-blur-lg border border-pink-400/40 text-white w-14 h-14 rounded-full shadow-[0_0_20px_rgba(236,72,153,0.3)] flex items-center justify-center text-2xl transition transform active:scale-95 hover:shadow-[0_0_30px_rgba(236,72,153,0.6)]">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div id="inner-fab-container" class="hidden absolute bottom-6 w-full px-6 flex justify-end pointer-events-none z-10">
            <button onclick="openContinuousInput()" class="pointer-events-auto bg-indigo-900/50 backdrop-blur-lg border border-indigo-400/50 text-white w-14 h-14 rounded-full shadow-[0_0_20px_rgba(99,102,241,0.4)] flex items-center justify-center text-2xl transition transform active:scale-95 hover:shadow-[0_0_30px_rgba(99,102,241,0.6)]">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        
        <div id="continuous-input-bar" class="hidden absolute bottom-0 w-full bg-[#0a0d20]/95 backdrop-blur-xl border-t border-indigo-500/40 p-2 flex items-center shadow-[0_-10px_30px_rgba(99,102,241,0.25)] slide-up z-30 pb-safe">
            <button onclick="closeContinuousInput()" class="p-3 text-indigo-300/70 hover:text-white transition-colors"><i class="fa-solid fa-times text-xl"></i></button>
            <input type="text" id="task-input" placeholder="Type and hit enter..." class="flex-grow bg-black/30 text-white placeholder-indigo-300/50 border border-indigo-500/30 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-400 focus:shadow-[0_0_15px_rgba(99,102,241,0.4)] mx-2 transition-all">
            <button id="btn-submit-task" onclick="submitTask()" class="bg-indigo-600/40 border border-indigo-400/50 text-white p-3 rounded-lg shadow-[0_0_15px_rgba(99,102,241,0.4)] hover:bg-indigo-600/60 hover:shadow-[0_0_25px_rgba(99,102,241,0.6)] transition-all"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="create-modal" class="hidden fixed top-0 left-0 w-full z-50 flex flex-col justify-end items-center sm:p-4" style="height: var(--app-height);">
        
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>

        <div class="relative bg-[#0f1021] border-t border-purple-500/40 sm:rounded-2xl rounded-t-[1.5rem] w-full max-w-md slide-up shadow-[0_-10px_40px_rgba(139,92,246,0.2)] flex flex-col px-5 py-6 z-10 overscroll-contain">
            
            <h2 id="modal-title" class="text-[22px] font-bold text-white mb-5 drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]">New List</h2>
            
            <input type="text" id="new-item-name" placeholder="Title..." class="w-full bg-[#16172e] text-white placeholder-indigo-300/40 border border-purple-500/40 shadow-[inset_0_0_10px_rgba(168,85,247,0.1)] rounded-xl px-4 py-3.5 mb-6 focus:outline-none focus:border-purple-400 focus:shadow-[0_0_20px_rgba(168,85,247,0.5)] font-medium text-[16px] transition-all">
            
            <div>
                <p class="text-[10px] font-bold text-indigo-300/70 uppercase tracking-widest mb-3 drop-shadow-sm">Color</p>
                <div class="flex space-x-4 mb-6 px-1" id="color-picker">
                    <button class="color-btn w-[30px] h-[30px] rounded-full bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.6)] transition-all shrink-0" onclick="selectColor(this, 'bg-red-500')"></button>
                    <button class="color-btn w-[30px] h-[30px] rounded-full bg-[#1e2337] shadow-[0_0_12px_rgba(99,102,241,0.5)] transition-all shrink-0 ring-2 ring-purple-400 ring-offset-2 ring-offset-[#0f1021]" onclick="selectColor(this, 'bg-[#1e2337]')"></button>
                    <button class="color-btn w-[30px] h-[30px] rounded-full bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.6)] transition-all shrink-0" onclick="selectColor(this, 'bg-green-500')"></button>
                    <button class="color-btn w-[30px] h-[30px] rounded-full bg-purple-500 shadow-[0_0_12px_rgba(168,85,247,0.6)] transition-all shrink-0" onclick="selectColor(this, 'bg-purple-500')"></button>
                    <button class="color-btn w-[30px] h-[30px] rounded-full bg-pink-500 shadow-[0_0_12px_rgba(236,72,153,0.6)] transition-all shrink-0" onclick="selectColor(this, 'bg-pink-500')"></button>
                </div>
            </div>

            <div>
                <p class="text-[10px] font-bold text-indigo-300/70 uppercase tracking-widest mb-3 drop-shadow-sm">Smart Symbol</p>
                <div class="flex space-x-5 overflow-x-auto pb-1 mb-8 px-1" id="icon-picker">
                    <button class="icon-btn shrink-0 w-11 h-11 rounded-2xl flex items-center justify-center transition-all bg-indigo-900/50 border border-indigo-400 shadow-[0_0_15px_rgba(99,102,241,0.5)] text-indigo-100" onclick="selectIcon(this, 'fa-list-ul')"><i class="fa-solid fa-list-ul text-lg"></i></button>
                    <button class="icon-btn shrink-0 w-11 h-11 rounded-2xl flex items-center justify-center text-white transition-all border border-transparent hover:bg-white/5" onclick="selectIcon(this, 'fa-cart-shopping')"><i class="fa-solid fa-cart-shopping text-lg"></i></button>
                    <button class="icon-btn shrink-0 w-11 h-11 rounded-2xl flex items-center justify-center text-white transition-all border border-transparent hover:bg-white/5" onclick="selectIcon(this, 'fa-briefcase')"><i class="fa-solid fa-briefcase text-lg"></i></button>
                    <button class="icon-btn shrink-0 w-11 h-11 rounded-2xl flex items-center justify-center text-white transition-all border border-transparent hover:bg-white/5" onclick="selectIcon(this, 'fa-plane')"><i class="fa-solid fa-plane text-lg"></i></button>
                    <button class="icon-btn shrink-0 w-11 h-11 rounded-2xl flex items-center justify-center text-white transition-all border border-transparent hover:bg-white/5" onclick="selectIcon(this, 'fa-home')"><i class="fa-solid fa-home text-lg"></i></button>
                </div>
            </div>

            <div class="flex justify-end items-center space-x-3 pt-1">
                <button onclick="closeModal()" class="px-5 py-2.5 text-indigo-200/90 font-bold hover:text-white transition-colors text-[15px]">Cancel</button>
                <button onclick="confirmCreate()" class="px-6 py-2.5 bg-[#282a5c] border border-indigo-500/50 text-white font-bold rounded-xl shadow-[0_0_15px_rgba(99,102,241,0.5)] hover:shadow-[0_0_25px_rgba(99,102,241,0.8)] hover:bg-[#343673] transition-all text-[15px]">Confirm</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // SERVICE WORKER REGISTRATION (PWA)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // ==========================================
        // MOBILE KEYBOARD VIEWPORT FIX 
        // ==========================================
        function setAppHeight() {
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${vh}px`);
            window.scrollTo(0, 0); 
        }
        
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setAppHeight);
        }
        window.addEventListener('resize', setAppHeight);
        setAppHeight(); 

        // ==========================================
        // 1. GOOGLE SYNC & FIREBASE SETUP
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA_YWKuufeaYMfZPUeUBj-sdNuUR9-nNrM",
            authDomain: "checklist-skfeatures.firebaseapp.com",
            projectId: "checklist-skfeatures",
            storageBucket: "checklist-skfeatures.firebasestorage.app",
            messagingSenderId: "881617648035",
            appId: "1:881617648035:web:19aeee8cdf0e2cbd7f4216",
            measurementId: "G-XYFFQKM2M5"
        };

        // Sync tracking variables
        let localDataVersion = 0;
        let lastSyncedVersion = 0;
        let syncTimeout = null;
        let isCloudSynced = false;
        let unsubscribeSnapshot = null;
        let currentUser = null;

        // Initialize state with local backup
        let rawBackup = JSON.parse(localStorage.getItem('checklist_backup')) || {};
        let appState = {
            currentLevel: 'home', 
            activeGroupId: null,
            activeListId: null,
            isLoggedIn: false,
            data: rawBackup.data || []
        };
        localDataVersion = rawBackup.localDataVersion || 0;

        let db, auth;
        if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
            
            // Enable offline persistence
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);
            db.enablePersistence({ synchronizeTabs: true }).catch(console.warn);
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    appState.isLoggedIn = true;
                    isCloudSynced = false;
                    document.getElementById('auth-text').innerText = "Log off";
                    
                    // Reset local data before syncing to prevent email crossover
                    appState.data = [];
                    localDataVersion = 0;
                    lastSyncedVersion = 0;
                    render(); // Clear screen momentarily while fetching
                    
                    syncDataFromGoogle(user);
                } else {
                    currentUser = null;
                    appState.isLoggedIn = false;
                    document.getElementById('auth-text').innerText = "Login";
                    if(unsubscribeSnapshot) {
                        unsubscribeSnapshot();
                        unsubscribeSnapshot = null;
                    }
                    
                    // Clear all local data and reset the screen on logout
                    appState.data = []; 
                    appState.currentLevel = 'home';
                    appState.activeGroupId = null;
                    appState.activeListId = null;
                    localDataVersion = 0;
                    lastSyncedVersion = 0;
                    localStorage.removeItem('checklist_backup'); 
                    
                    // Reset history state to home on logout
                    history.replaceState({ level: 'home', groupId: null, listId: null }, "");
                    render();
                }
            });
        }

        function toggleGoogleAuth() {
            if(!auth) {
                alert("Please add your Firebase Config in the code to enable Google Sync.");
                return;
            }
            if(appState.isLoggedIn) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider);
            }
        }
        
        function markDataChanged() {
            localDataVersion = Date.now();
        }

        function autoSaveToLocalStorage(immediate = false) {
            localStorage.setItem('checklist_backup', JSON.stringify({
                data: appState.data,
                localDataVersion: localDataVersion
            }));
            
            if (typeof window.syncToCloud === 'function') window.syncToCloud(immediate);
        }

        window.syncToCloud = function(immediate = false) {
            if (!currentUser || !isCloudSynced) return;
            if (localDataVersion <= lastSyncedVersion) return;

            const pushData = () => {
                const dataToSave = {
                    data: appState.data,
                    localDataVersion: localDataVersion,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                db.collection('users').doc(currentUser.uid).set(dataToSave, {merge: true})
                  .then(() => { lastSyncedVersion = localDataVersion; })
                  .catch(err => {
                      console.error("Cloud sync error", err);
                      if (err.code === 'permission-denied') {
                          alert("Unauthorized Account: You do not have permission to save data to this cloud.");
                          auth.signOut();
                      }
                  });
            };

            clearTimeout(syncTimeout);
            if (immediate) {
                pushData();
            } else {
                syncTimeout = setTimeout(pushData, 1000); // Debounce
            }
        };

        function syncDataFromGoogle(user) {
            unsubscribeSnapshot = db.collection('users').doc(user.uid).onSnapshot({ includeMetadataChanges: true }, doc => {
                if (doc.exists) {
                    isCloudSynced = true;
                    const cloudData = doc.data();
                    const cloudVersion = cloudData.localDataVersion || 0;

                    // Conflict Resolution: Last Write Wins based on timestamps
                    if (cloudVersion > localDataVersion) {
                        appState.data = cloudData.data || [];
                        localDataVersion = cloudVersion;
                        lastSyncedVersion = cloudVersion;
                        
                        autoSaveToLocalStorage();
                        render();
                    } else if (localDataVersion > cloudVersion) {
                        window.syncToCloud(true);
                    }
                } else {
                    if (!doc.metadata.fromCache) {
                        isCloudSynced = true;
                        window.syncToCloud(true);
                    }
                }
            }, err => {
                console.error("Firebase read blocked:", err);
                if (err.code === 'permission-denied') {
                    alert("Unauthorized Account: Your email is not allowed to access this database.");
                    auth.signOut();
                }
            });
        }

        // Network and Visibility Listeners for safety
        window.addEventListener('beforeunload', () => autoSaveToLocalStorage(true));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (navigator.onLine && currentUser) firebase.firestore().enableNetwork().catch(console.error);
            } else if (document.visibilityState === 'hidden') {
                autoSaveToLocalStorage(true);
            }
        });
        window.addEventListener('online', () => {
            if (currentUser) firebase.firestore().enableNetwork().catch(console.error);
        });
        window.addEventListener('offline', () => {
            if (currentUser) firebase.firestore().disableNetwork().catch(console.error);
        });

        // ==========================================
        // 2. STATE, HISTORY & DATA MANAGEMENT
        // ==========================================
        let tempCreationType = 'list';
        let tempColor = 'bg-[#1e2337]';
        let tempIcon = 'fa-list-ul';
        let sortableInstance = null;
        let editingItemId = null; 
        
        let isSelectionMode = false;
        let selectedTaskIds = new Set();

        // Push initial history state so the phone knows where 'home' is
        window.history.replaceState({ level: 'home', groupId: null, listId: null }, "");

        // Listen for Native System Back (Edge Swipe or Physical Back Button)
        window.addEventListener('popstate', (event) => {
            closeContinuousInput();
            isSelectionMode = false;
            selectedTaskIds.clear();

            if (event.state) {
                appState.currentLevel = event.state.level;
                appState.activeGroupId = event.state.groupId;
                appState.activeListId = event.state.listId;
            } else {
                appState.currentLevel = 'home';
                appState.activeGroupId = null;
                appState.activeListId = null;
            }
            render();
        });


        // ==========================================
        // 3. UI RENDERING & NAVIGATION
        // ==========================================
        const mainContent = document.getElementById('main-content');
        const backBtn = document.getElementById('back-btn');
        const outerFabs = document.getElementById('outer-fab-container');
        const innerFab = document.getElementById('inner-fab-container');
        const contInputBar = document.getElementById('continuous-input-bar');
        const btnNewGroup = document.getElementById('btn-new-group');

        function render() {
            mainContent.innerHTML = '';
            
            if (appState.currentLevel === 'home') {
                backBtn.classList.add('hidden');
                outerFabs.classList.remove('hidden');
                innerFab.classList.add('hidden');
                contInputBar.classList.add('hidden');
                btnNewGroup.classList.remove('hidden');
                
                let sortedData = [...appState.data].sort((a, b) => a.createdAt - b.createdAt);
                renderOuterItems(sortedData, mainContent);
            } 
            else if (appState.currentLevel === 'group') {
                backBtn.classList.remove('hidden');
                // Use history.back() for UI back button instead of manual logic
                backBtn.onclick = () => { history.back(); };
                outerFabs.classList.remove('hidden');
                innerFab.classList.add('hidden');
                contInputBar.classList.add('hidden');
                btnNewGroup.classList.add('hidden'); 
                
                let group = appState.data.find(g => g.id === appState.activeGroupId);
                let sortedItems = [...group.items].sort((a, b) => a.createdAt - b.createdAt);
                renderOuterItems(sortedItems, mainContent);
            } 
            else if (appState.currentLevel === 'list') {
                backBtn.classList.remove('hidden');
                // Use history.back() for UI back button instead of manual logic
                backBtn.onclick = () => { history.back(); };
                outerFabs.classList.add('hidden');
                innerFab.classList.remove('hidden'); 
                
                let list = getActiveList();
                renderInnerTasks(list);
            }
        }

        function openItem(id, type) {
            if (type === 'group') {
                appState.activeGroupId = id;
                appState.currentLevel = 'group';
            } else {
                appState.activeListId = id;
                appState.currentLevel = 'list';
            }
            // Push the new screen to the browser's history
            history.pushState({ level: appState.currentLevel, groupId: appState.activeGroupId, listId: appState.activeListId }, "");
            render();
        }

        function renderOuterItems(items, container) {
            const wrapper = document.createElement('div');
            wrapper.id = "sortable-container";
            wrapper.className = "space-y-4";
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-[#161a3a]/50 backdrop-blur-md p-3 rounded-2xl shadow-[0_0_15px_rgba(168,85,247,0.15)] border border-purple-500/30 flex items-center justify-between transition active:scale-95";
                div.dataset.id = item.id;
                
                div.innerHTML = `
                    <div class="flex items-center space-x-4 flex-grow cursor-pointer min-w-0 pr-2" onclick="openItem('${item.id}', '${item.type}')">
                        <div class="shrink-0 w-12 h-12 rounded-xl ${item.color} flex items-center justify-center text-white text-xl shadow-[0_0_15px_rgba(255,255,255,0.2)] border border-white/20">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <h3 class="font-bold text-white text-lg leading-tight truncate drop-shadow-md">${item.title}</h3>
                            <p class="text-xs text-indigo-300 font-medium uppercase mt-0.5 truncate">${item.type}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="openEditModal('${item.id}', event)" class="p-2 sm:p-2.5 text-indigo-300/60 hover:text-white transition-colors">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteItem('${item.id}', event)" class="p-2 sm:p-2.5 text-red-400/60 hover:text-red-400 transition-colors">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <div class="drag-handle p-2 sm:p-2.5 text-indigo-300/60 hover:text-white transition-colors">
                            <i class="fa-solid fa-grip-lines text-2xl"></i>
                        </div>
                    </div>
                `;
                wrapper.appendChild(div);
            });
            container.appendChild(wrapper);

            sortableInstance = new Sortable(document.getElementById('sortable-container'), {
                handle: '.drag-handle',
                animation: 200,
                delay: 150, 
                delayOnTouchOnly: true,
                onEnd: function (evt) {
                    // Reorder local array to match drag sorting if needed
                    const orderIds = sortableInstance.toArray();
                    if(appState.currentLevel === 'home') {
                        appState.data.sort((a,b) => orderIds.indexOf(a.id) - orderIds.indexOf(b.id));
                    } else if(appState.currentLevel === 'group') {
                        let group = appState.data.find(g => g.id === appState.activeGroupId);
                        group.items.sort((a,b) => orderIds.indexOf(a.id) - orderIds.indexOf(b.id));
                    }
                    markDataChanged();
                    autoSaveToLocalStorage();
                }
            });
        }

        function deleteItem(id, event) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this?")) return;

            if (appState.currentLevel === 'home') {
                appState.data = appState.data.filter(i => i.id !== id);
            } else if (appState.currentLevel === 'group') {
                let group = appState.data.find(g => g.id === appState.activeGroupId);
                if (group) {
                    group.items = group.items.filter(i => i.id !== id);
                }
            }
            markDataChanged();
            autoSaveToLocalStorage(true);
            render();
        }

        function getActiveList() {
            if (appState.activeGroupId) {
                let group = appState.data.find(g => g.id === appState.activeGroupId);
                return group.items.find(l => l.id === appState.activeListId);
            }
            return appState.data.find(l => l.id === appState.activeListId);
        }

        // ==========================================
        // 4. INNER FUNCTIONS (Tasks & Multi-select)
        // ==========================================
        function renderInnerTasks(list) {
            mainContent.innerHTML = '';
            
            let unchecked = list.items.filter(i => !i.completed);
            let checked = list.items.filter(i => i.completed);

            unchecked.sort((a, b) => {
                if (a.starred && !b.starred) return -1;
                if (!a.starred && b.starred) return 1;
                return a.createdAt - b.createdAt;
            });
            checked.sort((a, b) => a.createdAt - b.createdAt);

            const actionBar = document.createElement('div');
            actionBar.className = "flex justify-between items-center mb-4";
            actionBar.innerHTML = `
                <button onclick="toggleSelectionMode()" class="text-xs font-bold bg-indigo-900/40 text-indigo-200 px-3 py-2 rounded-lg border border-indigo-500/30 hover:bg-indigo-800/50 transition">
                    ${isSelectionMode ? 'Cancel Selection' : '<i class="fa-solid fa-list-check mr-1"></i> Select'}
                </button>
                <div class="space-x-2">
                    ${isSelectionMode ? `<button onclick="deleteSelectedTasks()" class="text-xs font-bold bg-red-900/40 text-red-200 px-3 py-2 rounded-lg border border-red-500/30 hover:bg-red-800/50 transition shadow-[0_0_10px_rgba(239,68,68,0.2)]">Delete Selected</button>` : ''}
                    <button onclick="clearAllTasks()" class="text-xs font-bold bg-red-900/40 text-red-200 px-3 py-2 rounded-lg border border-red-500/30 hover:bg-red-800/50 transition">Clear All</button>
                </div>
            `;
            mainContent.appendChild(actionBar);

            const uncheckedDiv = document.createElement('div');
            uncheckedDiv.className = "space-y-3 mb-8";
            unchecked.forEach(task => uncheckedDiv.appendChild(createTaskElement(task)));
            mainContent.appendChild(uncheckedDiv);

            if (checked.length > 0) {
                const title = document.createElement('h3');
                title.className = "text-xs font-bold text-indigo-300/70 uppercase tracking-widest mb-3 px-2";
                title.innerText = "Completed";
                mainContent.appendChild(title);

                const checkedDiv = document.createElement('div');
                checkedDiv.className = "space-y-3 opacity-60";
                checked.forEach(task => checkedDiv.appendChild(createTaskElement(task)));
                mainContent.appendChild(checkedDiv);
            }
        }

        function createTaskElement(task) {
            const el = document.createElement('div');
            const isSelected = selectedTaskIds.has(task.id);
            
            el.className = `bg-[#161a3a]/50 backdrop-blur-md p-4 rounded-xl shadow-[0_0_10px_rgba(99,102,241,0.15)] border flex items-center justify-between transition-all 
                ${task.completed && !isSelectionMode ? 'line-through text-white/40 border-indigo-500/10' : 'text-white border-indigo-500/30'} 
                ${isSelected ? 'ring-1 ring-indigo-400 bg-indigo-900/40' : ''}`;
            el.id = `task-${task.id}`;
            
            let selectionUI = '';
            if (isSelectionMode) {
                selectionUI = `
                    <div class="shrink-0 mr-4 cursor-pointer" onclick="toggleTaskSelection('${task.id}')">
                        <div class="w-6 h-6 rounded border-2 flex items-center justify-center transition-all ${isSelected ? 'bg-indigo-500 border-indigo-400 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)]' : 'border-indigo-400/50'}">
                            ${isSelected ? '<i class="fa-solid fa-check text-sm"></i>' : ''}
                        </div>
                    </div>
                `;
            }

            el.innerHTML = `
                <div class="flex items-center flex-grow min-w-0 cursor-pointer" ${isSelectionMode ? `onclick="toggleTaskSelection('${task.id}')"` : ''}>
                    ${selectionUI}
                    <span class="text-md font-medium pr-4 leading-snug min-w-0 break-words drop-shadow-sm flex-grow">${task.text}</span>
                </div>
                ${!isSelectionMode ? `
                <div class="flex items-center space-x-3 shrink-0">
                    <button onclick="editTask('${task.id}', event)" class="p-1 transition-all text-indigo-300/40 hover:text-indigo-200">
                        <i class="fa-solid fa-pen text-sm"></i>
                    </button>
                    <button onclick="toggleStar('${task.id}')" class="p-1 transition-all ${task.starred ? 'text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.8)] scale-110' : 'text-indigo-300/30 hover:text-yellow-400/70 hover:scale-110'}">
                        <i class="fa-solid fa-star text-lg"></i>
                    </button>
                    <button onclick="toggleTask('${task.id}')" class="shrink-0 w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all ${task.completed ? 'bg-indigo-500/50 border-indigo-400 text-white shadow-[0_0_10px_rgba(99,102,241,0.4)]' : 'border-indigo-400/50 hover:border-indigo-300 hover:shadow-[0_0_10px_rgba(99,102,241,0.3)]'}">
                        ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                    </button>
                </div>
                ` : ''}
            `;
            return el;
        }

        function editTask(taskId, event) {
            if (event) event.stopPropagation();
            let list = getActiveList();
            let task = list.items.find(t => t.id === taskId);
            
            let newText = prompt("Edit your task:", task.text);
            
            if (newText !== null && newText.trim() !== "") {
                task.text = newText.trim();
                renderInnerTasks(list);
                markDataChanged();
                autoSaveToLocalStorage();
            }
        }

        function toggleStar(taskId) {
            let list = getActiveList();
            let task = list.items.find(t => t.id === taskId);
            task.starred = !task.starred;
            renderInnerTasks(list);
            markDataChanged();
            autoSaveToLocalStorage();
        }

        function toggleSelectionMode() {
            isSelectionMode = !isSelectionMode;
            selectedTaskIds.clear();
            render();
        }

        function toggleTaskSelection(taskId) {
            if (selectedTaskIds.has(taskId)) {
                selectedTaskIds.delete(taskId);
            } else {
                selectedTaskIds.add(taskId);
            }
            render();
        }

        function deleteSelectedTasks() {
            if (selectedTaskIds.size === 0) return;
            if(!confirm(`Delete ${selectedTaskIds.size} selected task(s)?`)) return;

            let list = getActiveList();
            list.items = list.items.filter(t => !selectedTaskIds.has(t.id));
            
            selectedTaskIds.clear();
            isSelectionMode = false;
            markDataChanged();
            autoSaveToLocalStorage(true);
            render();
        }

        function clearAllTasks() {
            if(!confirm("Are you sure you want to delete ALL tasks in this list?")) return;
            let list = getActiveList();
            list.items = [];
            
            selectedTaskIds.clear();
            isSelectionMode = false;
            markDataChanged();
            autoSaveToLocalStorage(true);
            render();
        }

        const taskInput = document.getElementById('task-input');

        function openContinuousInput() {
            innerFab.classList.add('hidden');
            contInputBar.classList.remove('hidden');
            taskInput.focus(); 
        }

        function closeContinuousInput() {
            contInputBar.classList.add('hidden');
            if(appState.currentLevel === 'list') {
                innerFab.classList.remove('hidden');
            }
            taskInput.value = '';
            taskInput.blur(); 
        }

        function submitTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            let list = getActiveList();
            list.items.push({ id: Date.now().toString(), text: text, completed: false, starred: false, createdAt: Date.now() });
            
            taskInput.value = '';
            renderInnerTasks(list);
            markDataChanged();
            autoSaveToLocalStorage();

            setTimeout(() => taskInput.focus(), 10);
        }

        function toggleTask(taskId) {
            let list = getActiveList();
            let task = list.items.find(t => t.id === taskId);
            const taskEl = document.getElementById(`task-${taskId}`);
            
            if (!task.completed) {
                taskEl.classList.add('fade-down');
                setTimeout(() => {
                    task.completed = true;
                    renderInnerTasks(list);
                    markDataChanged();
                    autoSaveToLocalStorage();
                }, 400);
            } else {
                task.completed = false;
                renderInnerTasks(list);
                markDataChanged();
                autoSaveToLocalStorage();
            }
        }

        // ==========================================
        // 5. MODAL LOGIC (CREATE & EDIT)
        // ==========================================
        function openModal(type) {
            editingItemId = null; 
            tempCreationType = type;
            document.getElementById('modal-title').innerText = type === 'group' ? 'New Group' : 'New List';
            document.getElementById('new-item-name').value = ''; 
            
            tempColor = 'bg-[#1e2337]';
            tempIcon = type === 'group' ? 'fa-layer-group' : 'fa-list-ul';
            updateModalSelections();

            document.getElementById('create-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('new-item-name').focus(), 100);
        }

        function openEditModal(id, event) {
            event.stopPropagation(); 
            editingItemId = id;

            let itemToEdit = null;
            if (appState.currentLevel === 'home') {
                itemToEdit = appState.data.find(i => i.id === id);
            } else if (appState.currentLevel === 'group') {
                let group = appState.data.find(g => g.id === appState.activeGroupId);
                itemToEdit = group.items.find(i => i.id === id);
            }
            if (!itemToEdit) return;

            document.getElementById('modal-title').innerText = 'Edit ' + (itemToEdit.type === 'group' ? 'Group' : 'List');
            document.getElementById('new-item-name').value = itemToEdit.title;
            
            tempCreationType = itemToEdit.type;
            tempColor = itemToEdit.color;
            tempIcon = itemToEdit.icon;
            
            updateModalSelections();

            document.getElementById('create-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('new-item-name').focus(), 100);
        }

        function closeModal() {
            document.getElementById('create-modal').classList.add('hidden');
            document.getElementById('new-item-name').value = '';
            editingItemId = null;
        }

        function selectColor(btn, color) {
            tempColor = color;
            document.querySelectorAll('.color-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-purple-400', 'ring-offset-2', 'ring-offset-[#0f1021]');
            });
            btn.classList.add('ring-2', 'ring-purple-400', 'ring-offset-2', 'ring-offset-[#0f1021]');
        }

        function selectIcon(btn, icon) {
            tempIcon = icon;
            document.querySelectorAll('.icon-btn').forEach(b => {
                b.classList.remove('bg-indigo-900/50', 'border-indigo-400', 'shadow-[0_0_15px_rgba(99,102,241,0.5)]', 'text-indigo-100');
                b.classList.add('border-transparent', 'text-white');
            });
            btn.classList.remove('border-transparent', 'text-white');
            btn.classList.add('bg-indigo-900/50', 'border-indigo-400', 'shadow-[0_0_15px_rgba(99,102,241,0.5)]', 'text-indigo-100');
        }

        function updateModalSelections() {
            let foundColor = false;
            document.querySelectorAll('.color-btn').forEach(btn => {
                if(btn.className.includes(tempColor)) {
                    selectColor(btn, tempColor);
                    foundColor = true;
                }
            });
            if(!foundColor) {
                tempColor = 'bg-[#1e2337]';
                selectColor(document.querySelectorAll('.color-btn')[1], tempColor); 
            }

            document.querySelectorAll('.icon-btn').forEach(btn => {
                if(btn.innerHTML.includes(tempIcon)) {
                    selectIcon(btn, tempIcon);
                }
            });
        }

        function confirmCreate() {
            const name = document.getElementById('new-item-name').value.trim();
            if (!name) return;

            if (editingItemId) {
                let itemToEdit = null;
                if (appState.currentLevel === 'home') {
                    itemToEdit = appState.data.find(i => i.id === editingItemId);
                } else if (appState.currentLevel === 'group') {
                    let group = appState.data.find(g => g.id === appState.activeGroupId);
                    itemToEdit = group.items.find(i => i.id === editingItemId);
                }
                
                if (itemToEdit) {
                    itemToEdit.title = name;
                    itemToEdit.color = tempColor;
                    itemToEdit.icon = tempIcon;
                }
            } else {
                const newItem = {
                    id: Date.now().toString(),
                    type: tempCreationType,
                    title: name,
                    color: tempColor,
                    icon: tempIcon,
                    items: [],
                    createdAt: Date.now()
                };

                if (appState.currentLevel === 'group') {
                    let group = appState.data.find(g => g.id === appState.activeGroupId);
                    group.items.push(newItem);
                } else {
                    appState.data.push(newItem);
                }
            }

            markDataChanged();
            autoSaveToLocalStorage();
            closeModal();
            render();
        }

        // ==========================================
        // KEYBOARD 'ENTER' SUPPORT FOR ALL INPUTS
        // ==========================================
        
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitTask();
            }
        });

        const newItemNameInput = document.getElementById('new-item-name');
        newItemNameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmCreate(); 
            }
        });
        
        const searchInput = document.querySelector('input[placeholder="Search..."]');
        if (searchInput) {
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchInput.blur(); 
                }
            });
        }

        // Boot
        render();

    </script>
</body>
</html>
